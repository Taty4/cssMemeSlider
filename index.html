<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meme Slider</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1>Meme Slider</h1>
      <p>
        Pure <span class="accent-orange">Css</span>
        <span class="header-circle"></span>
        <span class="accent-brown">No</span> Javascript
      </p>
    </header>
    <main>
      <input type="radio" name="control" id="slide-1" checked />
      <input type="radio" name="control" id="slide-2" />
      <input type="radio" name="control" id="slide-3" />
      <input type="radio" name="control" id="slide-4" />
      <input type="radio" name="control" id="slide-5" />
      <div class="slider-bgc">
        <div class="slider-visible">
          <div class="slider-track">
            <img src="./src/img/IMG_5830.JPG" alt=" " />
            <img src="./src/img/IMG_5836.JPG" alt=" " />
            <img src="./src/img/IMG_5837.JPG" alt=" " />
            <img src="./src/img/IMG_5840.JPG" alt=" " />
            <img src="./src/img/IMG_5841.JPG" alt=" " />
          </div>
        </div>
      </div>
      <div class="wrapper-texts-controls">
        <div class="texts-visible">
          <div class="texts-track">
            <p>Нигде - лучший работодатель! 😎</p>
            <p>И так всегда 😫</p>
            <p>Даже котик не вывозит 🤷‍♂️</p>
            <p>Теперь и вы видели 😂</p>
            <p>Лучшее успокоительное, правда ведь? 😃</p>
          </div>
        </div>
        <div class="controls-label">
          <label for="slide-1">
            <span class="dot"></span>
          </label>
          <label for="slide-2">
            <span class="dot"></span>
          </label>
          <label for="slide-3">
            <span class="dot"></span>
          </label>
          <label for="slide-4">
            <span class="dot"></span>
          </label>
          <label for="slide-5">
            <span class="dot"></span>
          </label>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p>
        Made in <a href="https://rs.school/" target="_blank">RSschool</a> by
        <a href="https://github.com/Taty4">Tatsiana</a>
      </p>
    </footer>
  </body>
</html>
